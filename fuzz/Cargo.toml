[package]
name = "rrl-directory-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Marks this crate as a fuzz target set: `cargo fuzz` looks for it.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rrl-directory = { path = ".." }

# One target per parser that reads something an outsider controls. A parser that panics is a
# server that can be stopped from outside, which is why these are the ones worth fuzzing:
# the directory's own code cannot cause undefined behaviour (the crate forbids unsafe), but a
# panic is not undefined behaviour and `forbid` does not prevent it.

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ldif"
path = "fuzz_targets/ldif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema"
path = "fuzz_targets/schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dn"
path = "fuzz_targets/dn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint"
path = "fuzz_targets/endpoint.rs"
test = false
doc = false
bench = false

# One patch, repeated here because a patch applies to one workspace only: without it the fuzz build
# resolves `rasn-ldap` from crates.io, which does not have the assertion-failed result code this
# project added to its vendored copy.
#
# There used to be a second one, `rskrb5 = { path = "../vendor/rskrb5" }`, to keep crates.io's
# `rskrb5` - whose pin on a *release candidate* of `pbkdf2` clashed with the released 0.13.0 the
# server hashes passwords with - out of the graph. The SASL work removed the need for it: Kerberos
# now comes from the `krb5` crate (this family's fork of `rskrb5`, renamed at 1.0.0), and the
# directory server takes `rrl-crypto` without the `crypto-rskrb5` feature that would pull the old
# crate back in. `e78533a` deleted `vendor/rskrb5` and left this line behind, so for weeks the patch
# named a directory that did not exist and `cargo metadata` in this directory failed with
#
#     patch location `/w/vendor/rskrb5` does not contain packages matching `rskrb5`
#
# before it ever read the lock: fuzzing did not build, and nothing said why.
[patch.crates-io]
rasn-ldap = { path = "../vendor/rasn-ldap" }
