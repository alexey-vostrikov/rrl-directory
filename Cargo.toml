[package]
name = "rrl-directory"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "LDAP server with REST API & file backends"
license = "MIT"
readme = "README.md"

default-run = "rrl-directory"

[[bin]]
name = "rrl-directory"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
# The one trait this crate implements for another, whose method is `async`: the SMB layer asks for a
# machine password write across an await, and a hand-written `Pin<Box<...>>` here would be a second
# spelling of the same thing in the place least worth spending clarity on.
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
# The REST backend's HTTP client. hyper is already in the build through axum; asking for its
# `client` feature adds no crate, only the half of the protocol that is not compiled yet.
hyper = { version = "1.12.0", features = ["client", "http1"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
humantime = "2.4.0"
# The wire format of DNS, and the server loop that reads and writes it: a zone this crate serves
# must answer a validator's questions about the protocol, and hand-writing RFC 1035 would be a second
# place to be wrong about compression and message structure. `default-features = false` because the
# resolver, sqlite store and TOML configuration are not wanted: the zone lives in this server's own
# directory. MSRV 1.88, below the toolchain pinned here.
# `dnssec-ring` and not the SQLite store: it is the feature that carries `TSigner` and the TSIG
# buffer layout (RFC 8945) as well as the DNSSEC signing keys RRL-2.25.9 needs. `ring` is already in
# this dependency tree through rustls, so the feature adds no new crypto.
hickory-server = { version = "0.26.3", default-features = false, features = [
    "dnssec-ring",
], optional = true }
# The one place this crate steps outside safe Rust, and only to map a file it owns: see
# `src/index_file.rs`. Everything else - protocol parsing, TLS, HTTP, storage - is safe code.
memmap2 = "0.9"
md-5 = "0.11.0"
# HMAC-MD5 is the NTLM signature ([MS-NLMP] 3.4.4.2), and the same crate the tests already used.
hmac = "0.13.0"
pbkdf2 = "0.13.0"
# The NTLM security layer seals with RC4 ([MS-NLMP] 3.4.4.2), and this is the same crate the SMB
# acceptor already pulls in, so the graph gains no new code: `rc4` is RustCrypto's, safe Rust, and
# a range rather than an exact version for the reason every dependency here is.
rc4 = "0.2"
rasn = "0.30.0"
rasn-ldap = "0.30.0"
redb = "4.4.0"
# An LSM tree whose durability is object storage. Optional: a directory on one host keeps redb, and
# this is what a replica or a disposable host has to have instead.
slatedb = { version = "0.18", optional = true }
# The crypto layer: the NT hash and, in time, everything else this crate derives. One
# implementation of a primitive, not one per consumer.
rrl-crypto = { git = "https://github.com/alexey-vostrikov/rrl-crypto", branch = "main" }
# Kerberos for SASL GSSAPI, in pure Rust and with no C: the accept side, the SPNEGO wrapper and the
# per-message tokens all come from here. It replaces the vendored `rskrb5` and the hand-written
# framing this crate used to carry.
#
# From the fork, because what a domain controller needs is not in the 1.0.0 release: DER and
# `KerberosTime` come from `rrl-krb` there, so the two sides read the same encoding, and a `Key`
# wipes its octets when it is dropped. Both are on the branch this points at and neither is on
# crates.io. `branch` rather than `rev`, for the same reason as the dependencies below: the two
# crates are developed together and a pinned commit turns every change into a second commit here.
# Move it back to `krb5 = "1.0"` once those commits are in a release.
krb5 = { git = "https://github.com/alexey-vostrikov/krb5", branch = "main" }
roaring = "0.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = { version = "2.6.1", features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "time", "sync", "rt-multi-thread", "signal"] }
# default features pull aws-lc-rs and ring, which are C: keep only the wrapper
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12"] }
# String preparation for matching (RFC 4518). Both are pure Rust with no C: the alternative was
# `value.to_lowercase()`, which agrees with the RFC on ASCII and differs on everything else.
caseless = "0.2.2"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v5"] }
# The public certificate authorities, compiled in: a client that trusts whatever the
# filesystem happens to hold is a client that works on one machine only.
webpki-roots = "1.0.4"
yescrypt = "0.1.0"

# The KDC engine, for the two ways this crate uses it. In the daemon it answers port 88 in this
# process, reading the realm out of this server's own directory - which is the whole point of a
# self-contained domain: one process, one store, no second daemon to keep in step. In the tests it
# is an in-process realm to run a bind against, instead of a keytab on the test host.
#
# Optional because a directory server that does not issue tickets should not carry a KDC, and
# `RUST_HEIMDAL_KDC`-free builds stay what they were.
#
# From git, not from a path: a checkout that lives beside this one is a developer's convenience,
# and a path dependency silently becomes "no such package" on CI and on any machine that clones
# this repository alone. `branch = "main"` rather than `rev`: the two crates are developed
# together, and a pinned commit turns every KDC change into a second commit here before anything
# can be compiled against it. Run `cargo update -p rrl-kdc` to take a newer revision.
rrl-kdc = { git = "https://github.com/alexey-vostrikov/rrl-kdc", branch = "main", optional = true, features = ["hdb-ldap"] }

# SMB2/3 for `IPC$`, which is where a Samba member's join actually begins: it connects to
# `\\DC\IPC$` and opens `lsarpc` through it. Without `localfs` - this server serves no files - and
# with `krb5`, so a machine account can authenticate with the ticket it already has.
#
# From the fork, on its `main`: `lsarpc`, `samr` and Kerberos in SESSION_SETUP do not exist in the
# upstream release, and a path dependency on a sibling checkout resolves to "no such package" on any
# machine that cloned this repository alone. `branch` rather than `rev` for the same reason as
# `rrl-kdc` above; `cargo update -p smb-server` takes a newer revision. Move this back to
# `paltaio/rust-smb-server` once that work is merged upstream.
#
# `ipc` is named beside `krb5` because it is off by default: the pipes - `IPC$`, its named channels
# and the DCE/RPC on them - are the whole reason this daemon runs an SMB server at all, and a build
# that left them out would answer `BAD_NETWORK_NAME` to the first thing a join asks for.
smb-server = { git = "https://github.com/alexey-vostrikov/rrl-smb", branch = "main", optional = true, default-features = false, features = ["krb5", "ipc"] }

# Logging. `tracing` without a subscriber records nothing, and the call sites look instrumented
# either way - which is how a refusal in the RPC dispatcher came to be invisible. The subscriber
# reads what the configuration and the command line already offered: `-d`, `log_timestamp`,
# `log_caller`, `--log`.
tracing = "0.1.44"
# Only for `dns`: the inception and expiration of an `RRSIG` are calendar times, and `hickory` takes
# them as `time::OffsetDateTime`.
time = { version = "0.3.55", optional = true }
# The `NSEC3` owner label is base32hex without padding, which is `BASE32_DNSSEC` here - the same
# alphabet every other DNSSEC tool uses, and not base32 with a different table written by hand.
data-encoding = { version = "2.6", optional = true }
# `env-filter` for `RUST_LOG`: the reason to reach for it is always one module that misbehaves,
# and `RUST_LOG=smb_server::rpc=debug` says that without raising the whole process. `time` for
# `log_timestamp` in RFC 3339.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }

[features]
# Port 88: AS-REQ, TGS-REQ, and `krbtgt/<REALM>` provisioned on first start.
kdc = ["dep:rrl-kdc"]
# Port 445 and the `IPC$` share a join talks to.
#
# `smb` implies `kdc` and `dns`, and the implication is not a convenience: a member reaches this
# server by the `_ldap._tcp`/`_kerberos._tcp` records of the domain's own zone, and it opens port 445
# with a ticket this server issued. An SMB listener without either is a port nothing in the domain
# can find or authenticate to. The reverse is not true and is not declared: a realm and a zone are
# useful on their own - a KDC in front of somebody else's DNS is the ordinary arrangement - so `kdc`
# stands alone.
#
# Measured before this line: `cargo check --features smb` did not compile at all, because the LDAP
# NTLM bind under `cfg(feature = "smb")` reads `crate::kerberos`, which does not exist there. It went
# unnoticed because the gate built "no features" and "all features" and nothing between.
smb = ["dep:smb-server", "kdc", "dns"]
# Port 53 and the zone a domain lives in: the `dnsRecord` values under `CN=RRLDNS`.
# `dep:time` for the inception and expiration of a DNSSEC signature: they travel as seconds, and
# converting between that and a calendar date by hand is how a leap second becomes a rejected zone.
dns = ["dep:hickory-server", "dep:time", "dep:data-encoding"]
# The directory in an S3 bucket, `backends.<name>.type = "slate-s3"`: several servers on one store,
# and a host that can be replaced without a copy of the data. Off by default: an object store puts
# a 50 ms window in front of every durable write, which a directory on one host has no reason to take.
slate-s3 = ["dep:slatedb"]

[dev-dependencies]
rrl-kdc = { git = "https://github.com/alexey-vostrikov/rrl-kdc", branch = "main" }
futures = "0.3.34"
rcgen = "0.14.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
# The DNS tests speak the protocol themselves: a fake upstream and the client side of the exchange
# are written with the same crate the server is, because the point of `tests/dns_forward.rs` is the
# wire, and a mock of the wire would test the mock.
# `dnssec-ring` because `tests/dns_dnssec.rs` verifies the signatures this server makes, with the
# same code a validator uses - a signature nobody checks is a signature nobody knows is wrong.
hickory-server = { version = "0.26.3", default-features = false, features = ["dnssec-ring"] }
# `tests/dns_axfr.rs` decides on the address the connection arrives from, and this toolchain has no
# `std::net::TcpSocket` to bind the client side with. The test that would otherwise be written - call
# the policy function with an address - passes while the handler reads the wrong field.
socket2 = "0.6.5"

# A local copy of rasn-ldap with the RFC 4511 result codes upstream is missing
# (118-123, including assertionFailed). The patch is the enum variants only; it is
# meant to be offered upstream and dropped once a release carries them.
[patch.crates-io]
rasn-ldap = { path = "vendor/rasn-ldap" }

# No `[patch]` on absolute paths below, deliberately.
#
# Two of these used to sit here, pointing at `/sibling/rrl-smb` and `/sibling/rrl-krb5`: they made a
# container build against locally checked-out siblings work, and made every clean checkout fail with
#
#     patch location `/sibling/rrl-smb` does not contain packages matching `smb-server`
#
# which is what CI reported on every push. A patch in the manifest is part of the manifest, and a
# checkout cannot opt out of it.
#
# A build against local siblings is a developer's arrangement, not the repository's. Pass it where
# it belongs:
#
#     cargo --config 'patch."https://github.com/alexey-vostrikov/rrl-smb".smb-server.path="/sibling/rrl-smb"' \
#           --config 'patch."https://github.com/alexey-vostrikov/krb5".krb5.path="/sibling/rrl-krb5"' build
#
# or put the same in `.cargo/config.toml`, which is ignored here for exactly this reason.

